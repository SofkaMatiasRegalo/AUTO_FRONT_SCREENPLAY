serenity {
  project.name = "AUTO FRONT SCREENPLAY - F1 Autenticación"
  take.screenshots = FOR_FAILURES
  browser.height = 900
  browser.width = 1440
}

webdriver {
  base.url = "http://localhost:5173"
  driver = chrome
  autodownload = true
  chrome.switches = "--no-sandbox;--disable-dev-shm-usage;--disable-gpu;--disable-extensions;--remote-allow-origins=*"
}

headless.mode = false

cucumber.options = "--plugin pretty"
